<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>CORS probe</title></head>
<body>
<pre id="out">running…</pre>
<script>
const REL_API = 'https://api.github.com/repos/twinspapa84/shorts-maker/releases?per_page=3';
const lines = [];
function log(s){ lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }

async function probe(label, url, headers){
  const t0 = performance.now();
  try{
    const r = await fetch(url, {headers: headers||{}, cache:'no-store'});
    const len = r.headers.get('content-length');
    log(`PASS ${label} · status=${r.status} type=${r.headers.get('content-type')} len=${len} url=${r.url.slice(0,90)} ms=${Math.round(performance.now()-t0)}`);
    try{
      const b = await r.blob();
      log(`   blob ok · ${b.size} bytes`);
    }catch(e){ log(`   blob FAIL ${e}`); }
  }catch(e){
    log(`FAIL ${label} · ${e.name}: ${e.message} · ms=${Math.round(performance.now()-t0)}`);
  }
}

(async ()=>{
  let dl = 'https://github.com/twinspapa84/shorts-maker/releases/download/render-13/shorts_final.mp4';
  let assetId = null, tag = 'render-13';
  try{
    const r = await fetch(REL_API, {cache:'no-store'});
    const j = await r.json();
    tag = j[0].tag_name;
    const a = j[0].assets.find(x=>x.name==='shorts_final.mp4');
    assetId = a.id; dl = a.browser_download_url;
    log(`releases: PASS status=${r.status} tags=${j.map(x=>x.tag_name).join(',')}`);
  }catch(e){ log(`releases: FAIL ${e.name}: ${e.message}`); }

  await probe('global fetch supported', 'https://api.github.com/zen');
  await probe('browser_download_url (Range 0-1)', dl, {Range:'bytes=0-1'});
  await probe('browser_download_url (full)', dl);
  if(assetId) await probe('api asset + octet-stream (Range 0-1)', `https://api.github.com/repos/twinspapa84/shorts-maker/releases/assets/${assetId}`, {Accept:'application/octet-stream', Range:'bytes=0-1'});
  if(assetId) await probe('api asset + octet-stream (full)', `https://api.github.com/repos/twinspapa84/shorts-maker/releases/assets/${assetId}`, {Accept:'application/octet-stream'});
  log(`UA: ${navigator.userAgent}`);
  log(`canShare: ${!!navigator.canShare} share: ${!!navigator.share} secure: ${window.isSecureContext}`);
  log('DONE');
})();
</script>
</body></html>
