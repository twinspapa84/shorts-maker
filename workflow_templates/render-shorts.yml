# ─────────────────────────────────────────────────────────────
# 0원 쇼츠 자동 제작기 — GitHub Actions 렌더 워크플로
#
# 이 파일은 GitHub 웹에서 `.github/workflows/render-shorts.yml` 로
# 한 번만 복사해 넣으면 됩니다. (Pickle 앱 권한으로는 workflows 폴더에
# 푸시할 수 없어 템플릿으로 보관합니다.)
# ─────────────────────────────────────────────────────────────
name: render-shorts

run-name: "쇼츠 렌더 #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      payload_json:
        description: "렌더 설정 JSON (웹 스튜디오가 자동으로 채웁니다)"
        required: true
        type: string
      voice:
        description: "목소리 덮어쓰기 (비우면 payload 값) — ko-KR-InJoonNeural / ko-KR-HyunsuMultilingualNeural / ko-KR-SunHiNeural"
        required: false
        type: string
        default: ""
      rate:
        description: "말하기 속도 덮어쓰기 (비우면 payload 값) — +0% / +12% / +20%"
        required: false
        type: string
        default: ""
      template:
        description: "템플릿 덮어쓰기 (비우면 payload 값) — default / community"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: render-shorts
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 1) 코드 가져오기
        uses: actions/checkout@v4

      - name: 2) 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3) ffmpeg · 한국어 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum

      - name: 4) 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5) 입력값 저장
        env:
          PAYLOAD_JSON: ${{ inputs.payload_json }}
          OVR_VOICE: ${{ inputs.voice }}
          OVR_RATE: ${{ inputs.rate }}
          OVR_TEMPLATE: ${{ inputs.template }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get("PAYLOAD_JSON", "")
          try:
              payload = json.loads(raw) if raw.strip() else {}
          except Exception:
              payload = {}
          # 직접 실행할 때 위 입력칸에 적은 값이 payload 를 덮어씁니다
          for key in ("voice", "rate", "template"):
              v = (os.environ.get("OVR_" + key.upper()) or "").strip()
              if v and isinstance(payload, dict):
                  payload[key] = v
          pathlib.Path("payload.json").write_text(
              json.dumps(payload, ensure_ascii=False) if payload else raw, encoding="utf-8")
          print("payload 길이:", len(raw), "| 목소리:", payload.get("voice"),
                "| 템플릿:", payload.get("template", "default"))
          PY

      - name: 6) 쇼츠 렌더링
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/render_shorts.py --input payload.json --output output/shorts_final.mp4

      - name: 7) 결과물 보관 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/shorts_final.mp4
            output/thumbnail.jpg
            output/manifest.json
          retention-days: 7

      - name: 8) 다운로드 링크 만들기 (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-${GITHUB_RUN_NUMBER}"
          TITLE="쇼츠 렌더 #${GITHUB_RUN_NUMBER}"
          NOTES="0원 쇼츠 자동 제작기로 만든 영상입니다. 아래 Assets에서 shorts_final.mp4 를 내려받으세요."
          gh release create "$TAG" \
            output/shorts_final.mp4 \
            output/thumbnail.jpg \
            --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY" \
            || gh release upload "$TAG" output/shorts_final.mp4 output/thumbnail.jpg --clobber --repo "$GITHUB_REPOSITORY"
          echo "### 완성 🎬" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/shorts_final.mp4" >> "$GITHUB_STEP_SUMMARY"
